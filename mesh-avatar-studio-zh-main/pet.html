<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雷霆喵</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #2b2438;
    user-select: none; -webkit-user-select: none;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  html.ready, html.ready body { background: transparent; }

  #boot {
    position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(circle at 50% 42%, #3b3352 0%, #241e30 70%);
    color: #e9e3f7;
  }
  html.ready #boot { display: none; }
  #boot .ring {
    width: 46px; height: 46px; border-radius: 50%;
    border: 4px solid rgba(233, 227, 247, .18); border-top-color: #b9a8dc;
    animation: spin 1s linear infinite;
  }
  #boot .ring.paused { animation: none; border-top-color: #ff9b9b; }
  #boot .txt { font-size: 13px; letter-spacing: .06em; opacity: .85; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #stage { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; }
  #canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #canvas.dragging { cursor: grabbing; }

  #bubble {
    position: fixed; left: 50%; bottom: 66%; transform: translateX(-50%) translateY(6px) scale(.94);
    max-width: 84%; padding: 8px 12px; border-radius: 12px;
    background: #fffdf8; color: #3c3550; border: 2px solid #b9a8dc;
    box-shadow: 0 6px 18px rgba(60, 40, 90, .28);
    font-size: 13px; line-height: 1.45; text-align: center; white-space: pre-wrap;
    opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .16s ease;
    z-index: 20;
  }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px;
    background: #fffdf8; border-right: 2px solid #b9a8dc; border-bottom: 2px solid #b9a8dc;
    transform: translateX(-50%) rotate(45deg);
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

  #menu {
    position: fixed; z-index: 30; width: 182px; padding: 8px;
    background: #242936; color: #e9edf6; border: 1px solid #3d4759; border-radius: 12px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
    display: none; font-size: 12px; max-height: calc(100vh - 12px); overflow-y: auto;
  }
  #menu.show { display: block; }
  #menu .head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; }
  #menu .head b { font-size: 13px; letter-spacing: .04em; }
  #menu .head span { color: #8f9bb0; font-size: 11px; }
  #menu .hub {
    width: 100%; display: flex; align-items: center; gap: 7px; margin: 0 0 7px;
    padding: 6px 8px; border: 1px solid #343d4d; border-radius: 8px;
    background: #2b3242; color: #e9edf6; font-family: inherit; text-align: left; cursor: pointer;
  }
  #menu .hub:hover { background: #333c4f; }
  #menu .hub .dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7486; flex: none; }
  #menu .hub .dot.on { background: #6fd08c; box-shadow: 0 0 6px rgba(111, 208, 140, .7); }
  #menu .hub .hub-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  #menu .hub .hub-text b { font-size: 11px; font-weight: 600; color: #dfe6f2; }
  #menu .hub .hub-text i { font-size: 10px; font-style: normal; color: #93a1b8; }
  #menu .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  #menu .chips button {
    flex: none; padding: 4px 7px; border-radius: 7px; font-size: 11px;
    background: #303849; border: 1px solid #414c63; color: #dfe6f2;
  }
  #menu .chips button:hover { background: #3a4559; }
  #menu .sep { height: 1px; background: #343d4d; margin: 8px 2px; }
  #menu .item {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; color: #e9edf6;
    font-size: 12px; text-align: left; cursor: pointer;
  }
  #menu .item:hover { background: #313a4b; }
  #menu .item .state { color: #93a1b8; }
  #menu .item .state.on { color: #8fd6a8; }
  #menu .sizes { display: flex; gap: 5px; padding: 2px; }
  #menu .sizes button {
    flex: 1; padding: 5px 0; border-radius: 7px; font-size: 11px;
    background: #303849; border: 1px solid #414c63; color: #dfe6f2;
  }
  #menu .sizes button.active { background: #56679a; border-color: #7b90c9; }
  #menu .hint { padding: 4px 4px 2px; color: #8f9bb0; font-size: 10px; text-align: center; }
  #menu .item.danger { color: #ff9b9b; }
  #menu .item.danger:hover { background: #4a2c33; }

  #error {
    position: fixed; left: 8px; right: 8px; top: 8px; padding: 10px 12px; z-index: 40;
    border-radius: 10px; background: #5d1f2b; color: #fff; font-size: 12px; line-height: 1.5;
    display: none; white-space: pre-wrap;
  }
  #error.show { display: block; }
</style>
</head>
<body>
  <div id="boot"><div class="ring"></div><div class="txt">雷霆喵正在醒来…</div></div>
  <div id="stage"><canvas id="canvas"></canvas></div>
  <div id="bubble"></div>
  <div id="menu">
    <div class="head"><b>雷霆喵</b><span>右键菜单</span></div>
    <button class="hub" data-act="hub">
      <span class="dot" data-hub="dot"></span>
      <span class="hub-text"><b data-hub="text">未连接 tonyland</b><i data-hub="sub">本地待机</i></span>
    </button>
    <div class="chips" id="motionChips"></div>
    <div class="sep"></div>
    <button class="item" data-act="follow">眼神跟随 <span class="state" data-state="follow">开</span></button>
    <button class="item" data-act="idle">自动待机 <span class="state" data-state="idle">开</span></button>
    <button class="item" data-act="roam">自动走动 <span class="state" data-state="roam">开</span></button>
    <button class="item" data-act="topmost">窗口置顶 <span class="state" data-state="topmost">开</span></button>
    <div class="sizes">
      <button data-size="small">小</button><button data-size="medium">中</button><button data-size="large">大</button>
    </div>
    <div class="hint">滚轮缩放 · 拖动挪窝</div>
    <div class="sep"></div>
    <button class="item" data-act="announce">服务器公告 <span class="state" data-state="announce">无</span></button>
    <button class="item" data-act="sleep">去睡觉</button>
    <button class="item" data-act="reset">回到右下角</button>
    <button class="item danger" data-act="quit">退出桌宠</button>
  </div>
  <div id="error"></div>
  <script type="module" src="./desktop-pet/pet.js"></script>
</body>
</html>
